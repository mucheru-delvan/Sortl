# Local development manifest. For the Flathub submission, replace the `dir`
# source with the pinned `git` source shown in the comment below.
app-id: io.github.mucheru_delvan.Sortl
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: sortl

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Direct access to the folders people actually need tidied. Folders granted
  # through the file chooser portal are served by the document portal's FUSE
  # layer, which intermittently reports a just-moved file as missing, so Sortl
  # refuses those and asks for a folder it can reach directly.
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=xdg-desktop

modules:
  - name: sortl
    buildsystem: meson
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - .venv
          - build
          - .flatpak-builder
          - repo
      # Flathub submission:
      # - type: git
      #   url: https://github.com/mucheru-delvan/Sortl.git
      #   tag: v0.1.0
      #   commit: <full 40-char commit sha of the tag>
