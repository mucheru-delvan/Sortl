# Local development manifest. For the Flathub submission, replace the `dir`
# source with the pinned `git` source shown in the comment below.
app-id: io.github.mucheru_delvan.Sortl
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: sortl

finish-args:
  # GUI only. No filesystem access: folders are granted per use through the
  # FileChooser portal (Gtk.FileDialog).
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: sortl
    buildsystem: meson
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - .venv
          - build
          - .flatpak-builder
          - repo
      # Flathub submission:
      # - type: git
      #   url: https://github.com/mucheru-delvan/Sortl.git
      #   tag: v0.1.0
      #   commit: <full 40-char commit sha of the tag>
