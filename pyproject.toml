[project]
name = "sortl"
version = "0.1.1"
description = "Safely organize a folder into category folders, with a preview and a verified move journal."
readme = "README.md"
authors = [
    { name = "Delvan Mucheru", email = "mkdelvan9@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
sortl = "sortl:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
